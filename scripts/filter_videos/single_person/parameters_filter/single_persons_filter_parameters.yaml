video_input:
  verbose_filename: true
  minimal_resolution: 256


tracking:
  use_saved_data: true
  yolo_weights_path: '/home/anton/work/fitMate/repFit/core/filters/single_person/weights'
  yolo_model: 'yolo11x-pose.pt'
  frames_stride: 3
  person_minimal_time: 3 # time in seconds
  skip_tracked_videos: false
  tracking_persist: true
  verbose_tracking: false
  visualize_while_tracking: false
  tracked_data_suffix: 'tracked_data'
  write_tracked_data: true


visualization:
  do_visualization: false
  bounding_box_thickness: 2
  hsv_step: 20 # Hue step in degrees for HSV model
  draw_keypoints: true # draw skeleton joints
  keypoints_confidence_threshold: 0.2
  show_frame_delay: 10


persons_data_filtering:
  do_filtering: true
  confidence:
    apply: true
    confidence_threshold: 0.4 # confidence in [0, 1] interval
  absolute_area:
    apply: true
    area_threshold: 1000 # square pixels
  area_ratio:
    apply: true
    ratio_threshold: 5
  segments_duration:
    apply: true
    duration_threshold: 1.5 # duration time in seconds
  bridging_gaps:
    apply: true
    gap_threshold: 1.0 # duration time in seconds
  partial_person:
    apply: true
    joints_confidence_threshold: 0.65 # confidence in [0, 1] interval
    joints_number_threshold: 5


persons_full_body_data_filtering:
  do_filtering: true
  full_body:
    apply: true
    joints_confidence_threshold: 0.7 # confidence in [0, 1] interval
    joints_number_threshold: 16
  bridging_gaps:
    apply: true
    gap_threshold: 4.5 # duration time in seconds
  segments_duration:
    apply: true
    duration_threshold: 0.5 # duration time in seconds


video_segments_writer:
  write_persons_tracks: true
  video_suffix: 'single_person'
  whole_person_duration_threshold: 3  # time in seconds
  whole_person_gap_duration: 4  # time in seconds
  enlarge_whole_person_bounding_boxes: true
  enlarge_bounding_boxes_direction: 'random' # value could be vertical, horizontal or random.
  verbose_output_filename: true