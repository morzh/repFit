video_input:
  verbose_filename: true
  minimal_resolution: 256


tracking:
  use_saved_data: true
  yolo_weights_path: '/home/anton/work/fitMate/repFit/core/filters/single_person/weights'
  yolo_model: 'yolo11l-pose.pt'
  frames_stride: 3
  person_minimal_time: 3 # time in seconds
  skip_tracked_videos: true
  tracking_persist: true
  verbose_tracking: false
  visualize_while_tracking: false
  tracked_data_suffix: 'tracked_data'
  write_tracked_data: false


do_filtering: true
tracked_data_filtering:
  do_filtering: true
  mean_confidence:
    apply: true
    mean_confidence_threshold: 0.6
  absolute_area:
    apply: true
    area_threshold: 1000 # square pixels
  area_ratio:
    apply: true
    ratio_threshold: 6
    mean_confidence_threshold: 0.5
  copy_symmetric_occluded_joints: # in case of occlusion, use values from symmetric joints
    apply: true
    add_noise: true

partial_body_filtering:
  do_filtering: false
  confidence:
    apply: false
    confidence_threshold: 0.4 # confidence in [0, 1] interval
  joints:
    apply: true
    joints_confidence_threshold: 0.7 # confidence in [0, 1] interval
    minimum_number_joints_threshold: 6
    maximum_number_joints_threshold: 15
  bridging_gaps:
    apply: true
    gap_threshold: 1.0 # duration time in seconds
  segments_duration:
    apply: true
    duration_threshold: 1.5 # duration time in seconds

full_body_filtering:
  do_filtering: false
  confidence:
    apply: false
    confidence_threshold: 0.4 # confidence in [0, 1] interval
  joints:
    apply: true
    joints_confidence_threshold: 0.7 # confidence in [0, 1] interval
    minimum_number_joints_threshold: 16
    maximum_number_joints_threshold: 17

inter_persons_filtering:
  do_filtering: false
  bounding_boxes_iou:
    apply: false
    iou_threshold: 0.4
    confidence_threshold: 0.5

segments_filtering:
  do_filtering: false
  bridging_gaps:
    apply: true
    gap_threshold: 4.5 # duration time in seconds
  segments_duration:
    apply: true
    duration_threshold: 0.5 # duration time in seconds


visualization:
  do_visualization: true
  maximum_width: 1920  # width in pixels
  maximum_height: 1080  # height in pixels
  bounding_box_thickness: 2 # box around character thickness
  hsv_step: 20 # Hue step in degrees for HSV model
  draw_keypoints: true # draw skeleton joints
  keypoints_confidence_threshold: 0.2
  show_frames: true
  show_frame_delay: 3  # OpenCV waitKey() delay
  write_video: true
  skip_existing_videos: true
  visualization_videos_folder: 'visualization'


video_segments_writer:
  write_persons_tracks: false
  video_suffix: 'single_person'
  full_body_person_segment_duration_threshold: 3  # duration is in seconds
  full_body_person_segment_gap_duration_threshold: 4  # gap duration is in seconds
  enlarge_full_body_person_bounding_boxes: true # save maximum single person area from input video
  enlarge_direction_of_full_body_person_bounding_boxes: 'horizontal' # value could be vertical, horizontal or random.
  verbose_output_filename: true
